# Continuous integration: lint, test (against a real MongoDB), build.
# Render auto-deploys main after this passes (enable "Wait for CI" in Render).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Server tests (in-memory store)
        run: npm test -w server
      - name: Server tests (MongoDB)
        run: npm test -w server
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/fitcoach_test
      - name: Client tests
        run: npm test -w client
      - name: Build client
        run: npm run build
      - name: Dependency audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high
